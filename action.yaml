name: GitHub Actions Version Updater
description: Scan workflow files, bump outdated GitHub Action pins, and open a pull request with the changes.
author: Maksudul Haque
branding:
  icon: 'upload-cloud'
  color: 'green'
inputs:
  committer_username:
    description: 'Name of the user who will commit the changes to GitHub'
    required: false
    default: 'github-actions[bot]'
  committer_email:
    description: 'Email Address of the user who will commit the changes to GitHub'
    required: false
    default: 'github-actions[bot]@users.noreply.github.com'
  commit_message:
    description: 'Commit message for the commits created by the action'
    required: false
    default: 'Update GitHub Action Versions'
  pull_request_title:
    description: 'Title of the pull requests generated by the action'
    required: false
    default: 'Update GitHub Action Versions'
  pull_request_branch:
    description: 'The pull request branch name (If provided, the action will force push to the branch)'
    required: false
    default: ''
  ignore:
    description: 'A comma separated string of GitHub Actions to ignore updates for'
    required: false
    default: ''
  token:
    description: 'GitHub Personal Access Token with `workflow` scope'
    required: true
  skip_pull_request:
    description: 'Skip Pull Request creation'
    required: false
    default: 'false'
  update_version_with:
    description: 'Use The Latest Release Tag/Commit SHA or Default Branch Commit SHA to update the actions. options: "release-tag" (default), "release-commit-sha", "default-branch-sha"'
    required: false
    default: 'release-tag'
  release_types:
    description: 'A comma separated string of release types (major, minor, patch) to use when updating the actions. By default, all release types are used to update the actions. Only Applicable for "release-tag", "release-commit-sha"'
    required: false
    default: 'all'
  pull_request_user_reviewers:
    description: 'A comma separated string (usernames) which denotes the users that should be added as reviewers to the pull request'
    required: false
    default: ''
  pull_request_team_reviewers:
    description: 'A comma separated string (team slugs) which denotes the teams that should be added as reviewers to the pull request'
    required: false
    default: ''
  pull_request_labels:
    description: 'A comma separated string (label names) which denotes the labels which will be added to the pull request'
    required: false
    default: ''
  extra_workflow_locations:
    description: 'A comma separated string of file or directory paths to look for workflows. By default, only the workflow files in the .github/workflows directory are checked updates'
    required: false
    default: ''

outputs:
  GHA_UPDATE_PR_NUMBER:
    description: The number of the created pull request.
    value: ${{ steps.pull-request.outputs.GHA_UPDATE_PR_NUMBER }}
  pull-request-number:
    description: The number of the created pull request.
    value: ${{ steps.pull-request.outputs.pull-request-number }}

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: true
        python-version: "3.14"

    - name: Install updater from this action
      shell: bash
      env:
        UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/gha-update
      run: |
        uv sync --project "${{ github.action_path }}" --frozen --no-dev --no-editable --extra action
        echo "${{ runner.temp }}/gha-update/bin" >> "${GITHUB_PATH}"

    - name: Update GitHub Action versions
      id: update
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        INPUT_IGNORE: ${{ inputs.ignore }}
        INPUT_UPDATE_VERSION_WITH: ${{ inputs.update_version_with }}
        INPUT_RELEASE_TYPES: ${{ inputs.release_types }}
        INPUT_EXTRA_WORKFLOW_LOCATIONS: ${{ inputs.extra_workflow_locations }}
        GHA_UPDATE_PR_BODY_FILE: ${{ runner.temp }}/gha-update-pr-body.md
      run: |
        args=(
          --pr-body-file "${GHA_UPDATE_PR_BODY_FILE}"
          --update-version-with "${INPUT_UPDATE_VERSION_WITH}"
          --release-types "${INPUT_RELEASE_TYPES}"
        )
        if [ -n "${INPUT_IGNORE}" ]; then
          args+=(--ignore "${INPUT_IGNORE}")
        fi
        if [ -n "${INPUT_EXTRA_WORKFLOW_LOCATIONS}" ]; then
          args+=(--extra-workflow-locations "${INPUT_EXTRA_WORKFLOW_LOCATIONS}")
        fi
        gha-update "${args[@]}"

    - name: Fail when updates exist and pull request is skipped
      if: ${{ contains(fromJSON('["true", "True", "TRUE", "1"]'), inputs.skip_pull_request) }}
      shell: bash
      run: |
        if git diff --quiet && git diff --cached --quiet; then
          echo "Everything is up-to-date."
          exit 0
        fi
        {
          echo "### GitHub Actions Version Updates"
          echo
          echo "Updates found but skipping pull request."
          echo
          echo "<details><summary>Git Diff</summary>"
          echo
          echo '```diff'
          git diff
          echo '```'
          echo
          echo "</details>"
        } >> "${GITHUB_STEP_SUMMARY}"
        echo "::error::Updates found but skipping pull request. Checkout build summary for update details."
        exit 1

    - name: Create pull request
      id: pull-request
      if: ${{ !contains(fromJSON('["true", "True", "TRUE", "1"]'), inputs.skip_pull_request) }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        GHA_UPDATE_COMMITTER_USERNAME: ${{ inputs.committer_username }}
        GHA_UPDATE_COMMITTER_EMAIL: ${{ inputs.committer_email }}
        GHA_UPDATE_COMMIT_MESSAGE: ${{ inputs.commit_message }}
        GHA_UPDATE_PULL_REQUEST_TITLE: ${{ inputs.pull_request_title }}
        GHA_UPDATE_PULL_REQUEST_BRANCH: ${{ inputs.pull_request_branch }}
        GHA_UPDATE_PULL_REQUEST_USER_REVIEWERS: ${{ inputs.pull_request_user_reviewers }}
        GHA_UPDATE_PULL_REQUEST_TEAM_REVIEWERS: ${{ inputs.pull_request_team_reviewers }}
        GHA_UPDATE_PULL_REQUEST_LABELS: ${{ inputs.pull_request_labels }}
        GHA_UPDATE_PR_BODY_FILE: ${{ runner.temp }}/gha-update-pr-body.md
      run: |
        if git diff --quiet && git diff --cached --quiet; then
          echo "Everything is up-to-date."
          exit 0
        fi
        gha-update-pr
