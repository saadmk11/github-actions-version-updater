name: SHA comment shapes
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: 'actions/setup-python@a1b2c3d4e5f60718293a4b5c6d7e8f9012345678'  # v5.0.0
      - uses: "actions/cache@b2c3d4e5f60718293a4b5c6d7e8f90123456789a"  # v4.0.2
      - uses: actions/setup-node@c3d4e5f60718293a4b5c6d7e8f90123456789ab  # v4.1.0
      - uses: docker/login-action@d4e5f60718293a4b5c6d7e8f90123456789abc0  # v3.3.0
      - uses: actions/upload-artifact@e5f60718293a4b5c6d7e8f90123456789abcd01  # v4.3.1
      - uses: "actions/github-script@f60718293a4b5c6d7e8f90123456789abcde012"  # v7.0.1
      - uses: actions/labeler@0123456789abcdef0123456789abcdef01234567  # keep my note
      - uses: actions/stale@123456789abcdef0123456789abcdef012345678 # latest
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
      - uses: owner/nested/action@23456789abcdef0123456789abcdef0123456789  # v1.4.0
      - uses: org/tool/.github/workflows/ci.yml@3456789abcdef0123456789abcdef01234567890  # v2.1.0
      - uses: ./local
      - uses: docker://alpine:3
      - run: echo "actions/checkout@v3"
