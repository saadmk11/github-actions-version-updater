name: Anchors
on: push
env: &shared_env
  NODE_VERSION: "18"
  CI: true
jobs:
  lint:
    runs-on: ubuntu-latest
    env: *shared_env
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
  test:
    runs-on: ubuntu-latest
    env: *shared_env
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4