name: Changelog CI

on:
  pull_request:
    types: [opened]

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true # changelog-ci git-pushes the updated changelog

      - name: Run Changelog CI
        uses: saadmk11/changelog-ci@ed0c1a6b31e9b31d1baa74f66261d5d39c1f9705 # v2.0.2
        with:
          github_token: ${{ github.token }}
          commit_changelog: 'true'
          summary: 'true'
