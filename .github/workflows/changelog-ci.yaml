name: Changelog CI

on:
  pull_request:
    types: [opened]

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7.0.1 # v4.2.2
        with:
          persist-credentials: true # changelog-ci git-pushes the updated changelog

      - name: Run Changelog CI
        uses: saadmk11/changelog-ci@v2.0.2 # v2.0.2
        with:
          github_token: ${{ github.token }}
          commit_changelog: 'true'
          summary: 'true'
