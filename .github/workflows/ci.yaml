name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.12"
            tox: py312
          - python: "3.13"
            tox: py313
          - python: "3.14"
            tox: py314
          - python: "3.15"
            tox: py315
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.4"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Test the supported interpreter and action extra
        env:
          TOX_ENV: ${{ matrix.tox }}
        run: uv run --locked --only-group tox tox run -e "$TOX_ENV"

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.14"
            tox: lint,type,coverage,base
          - python: "3.12"
            tox: minimum
          - python: "3.15"
            tox: latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.4"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Run local quality and dependency checks
        env:
          TOX_ENV: ${{ matrix.tox }}
        run: uv run --locked --only-group tox tox run -e "$TOX_ENV"

  package:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.4"
          python-version: "3.14"
          enable-cache: true
      - name: Build and test clean wheel and source installations
        run: uv run --locked --only-group tox tox run -e package
